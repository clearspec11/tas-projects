# Build the site and publish it to the `hostinger` branch.
# Hostinger's Git integration (hPanel -> Advanced -> GIT) pulls that branch
# into the document root, so the live site is tas.beetoff.xyz.
name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # SvelteKit reads these via $env/dynamic/public; the PUBLIC_ prefix is
          # required. The anon/publishable key is safe to expose (RLS is
          # read-only) — it ships in the client bundle either way.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Publish build to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: hostinger
          force_orphan: true     # keep the branch a single clean commit of built output
